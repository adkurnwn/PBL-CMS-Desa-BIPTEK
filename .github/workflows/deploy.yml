name: Build and Deploy CMS Desa

on:
  push:
    branches: 
      - dev/dockerize
    workflow_dispatch:

env:
  DOCKER_IMAGE: adkurnwn/cms-desa-biptek
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  DEV_DEPLOY_SERVER: ${{ secrets.DEV_DEPLOY_SERVER }}
  DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
  DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
  DEV_DEPLOY_PORT: ${{ secrets.DEV_DEPLOY_PORT }}
  DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
  
jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/dev/dockerize'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          # Save the private key from GitHub secrets
          echo "${{ env.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          # Set proper permissions (SSH requires these permissions)
          chmod 600 ~/.ssh/deploy_key
          # Add server to known hosts to prevent first-time connection prompts
          ssh-keyscan -p ${{ env.DEV_DEPLOY_PORT }} -H ${{ env.DEV_DEPLOY_SERVER }} >> ~/.ssh/known_hosts
      

      - name: Deploy to server
        run: |
          # Execute deployment commands via SSH
          ssh -i ~/.ssh/deploy_key -p ${{ env.DEV_DEPLOY_PORT }} -o StrictHostKeyChecking=no \
            ${{ env.DEV_DEPLOY_USER }}@${{ env.DEV_DEPLOY_SERVER }} << 'EOF'
            
            # Navigate to application directory
            cd ${{ env.DEV_DEPLOY_PATH }}
            
            echo "Pulling latest Docker images..."
            docker compose pull
            
            echo "Stopping existing containers..."
            docker compose down
            
            echo "Starting containers with new images..."
            docker compose up -d
            
            echo "Cleaning up unused images..."
            docker image prune -f
            
            echo "Container status:"
            docker compose ps
            
          EOF
            
      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed!"
          fi