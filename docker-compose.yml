services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-desa-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-storage:/var/www/storage
      - app-public:/var/www/public
    networks:
      - cms-desa-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: cms-desa-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-public:/var/www/public:ro
      - app-storage:/var/www/storage:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites/:/etc/nginx/sites-available/:ro
      - ./docker/nginx/ssl/:/etc/ssl/:ro
    depends_on:
      - app
    networks:
      - cms-desa-network

  db:
    image: mysql:8.0
    container_name: cms-desa-db
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: cms_desa
      MYSQL_USER: cms_user
      MYSQL_PASSWORD: cms_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - cms-desa-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - cms-desa-network

volumes:
  cms-desa-db-data:
    driver: local
  app-storage:
    driver: local
  app-public:
    driver: local

networks:
  cms-desa-network:
    driver: bridge